[project]
name = "teamstorm"
version = "0.1.0"
description = "Клиент TeamStorm Public API для всех пространств"
requires-python = ">=3.9"

[project.scripts]
ts = "ts.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ts*"]
